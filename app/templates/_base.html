<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#141414;font-family:Segoe UI,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#141414;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="background:#1f1f1f;border-radius:10px;overflow:hidden;max-width:600px;width:100%;">
        <tr>
          <td style="background:#2d2d2d;padding:18px 28px;border-bottom:3px solid #e5a00d;">
            <span style="color:#e5a00d;font-size:20px;font-weight:700;">▶ {{ server }}</span>
            <span style="color:#888;font-size:12px;float:right;padding-top:6px;">powered by PlexPulse</span>
          </td>
        </tr>
        <tr><td style="padding:26px 28px;color:#ddd;font-size:14px;line-height:1.55;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr>
          <td style="background:#191919;padding:14px 28px;color:#666;font-size:11px;">
            You're receiving this because you're on the {{ server }} notification list.
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
