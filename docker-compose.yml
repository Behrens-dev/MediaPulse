services:
  mediapulse:
    build: .
    image: mediapulse:latest
    container_name: mediapulse
    restart: unless-stopped
    ports:
      - "8181:8181"
    volumes:
      - mediapulse-config:/config
    environment:
      # Optional: pre-seed the Plex connection (can also be set in the UI)
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - TZ=${TZ:-America/New_York}

volumes:
  mediapulse-config:
